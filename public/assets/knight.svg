<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Team colour is drawn in blue (#2f6fe0 family); the game re-tints blue hues per player. -->
  <ellipse cx="64" cy="118" rx="30" ry="7" fill="#000" opacity="0.25"/>
  <!-- legs -->
  <rect x="50" y="88" width="11" height="26" rx="3" fill="#8b929c" stroke="#3a3f47" stroke-width="2"/>
  <rect x="67" y="88" width="11" height="26" rx="3" fill="#8b929c" stroke="#3a3f47" stroke-width="2"/>
  <!-- sword -->
  <rect x="96" y="30" width="6" height="58" rx="2" fill="#d9dde3" stroke="#3a3f47" stroke-width="2"/>
  <rect x="88" y="84" width="22" height="6" rx="2" fill="#7a5a2b" stroke="#3a3f47" stroke-width="2"/>
  <rect x="96" y="90" width="6" height="12" rx="2" fill="#5c4320" stroke="#3a3f47" stroke-width="2"/>
  <!-- body armour + tabard -->
  <path d="M42 54 Q64 44 86 54 L84 94 Q64 100 44 94 Z" fill="#a7adb6" stroke="#3a3f47" stroke-width="3"/>
  <path d="M52 56 L76 56 L74 96 Q64 99 54 96 Z" fill="#2f6fe0" stroke="#1b3f86" stroke-width="2"/>
  <path d="M64 62 L64 88 M56 72 L72 72" stroke="#e8edf5" stroke-width="4" stroke-linecap="round"/>
  <!-- arm holding sword -->
  <rect x="82" y="58" width="12" height="26" rx="5" fill="#8b929c" stroke="#3a3f47" stroke-width="2"/>
  <!-- helmet -->
  <path d="M44 38 Q44 14 64 14 Q84 14 84 38 L84 50 Q64 58 44 50 Z" fill="#b9bfc8" stroke="#3a3f47" stroke-width="3"/>
  <rect x="50" y="32" width="28" height="5" rx="2" fill="#2b2f36"/>
  <path d="M64 37 L64 52" stroke="#2b2f36" stroke-width="3"/>
  <!-- plume -->
  <path d="M64 14 Q60 2 74 4 Q82 6 80 16 Q72 10 64 14 Z" fill="#2f6fe0" stroke="#1b3f86" stroke-width="2"/>
  <!-- shield -->
  <path d="M22 58 L46 54 L46 80 Q40 94 34 96 Q26 92 22 80 Z" fill="#2f6fe0" stroke="#1b3f86" stroke-width="3"/>
  <path d="M34 62 L34 88 M26 72 L42 70" stroke="#f2c84b" stroke-width="4" stroke-linecap="round"/>
</svg>
