# Render Blueprint: https://render.com/docs/blueprint-spec
# Render → New → Blueprint → pick this repository → Apply.
services:
  - type: web
    name: zeka-doyushu
    runtime: node
    plan: free
    branch: main
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
